<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Chestnut Adventure</title>
  <meta name="description" content="A cosy point-and-click adventure about a small chestnut with a big dream.">
  <meta name="theme-color" content="#1d2433">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='34' r='22' fill='%237aa348'/%3E%3Ccircle cx='32' cy='36' r='14' fill='%238a4a22'/%3E%3Ccircle cx='36' cy='32' r='5' fill='%23fff4dd'/%3E%3Ccircle cx='37' cy='33' r='2.5' fill='%232b1a12'/%3E%3C/svg%3E">

  <script type="importmap">
  {

  <div id="app">
    <div id="rotate-hint">

      <div data-i18n="ui.rotate">Rotate your device</div>

    <div id="stage-box">
      <canvas id="stage" aria-label="Chestnut Adventure game stage"></canvas>
      <div id="vignette"></div>
      <div id="ui"></div>
    </div>
  </div>

  <!-- three.js is an ES module; this one module runs first (deferred, in document order)
       and hands the library to the classic scripts below through window.THREE -->
  <script type="module" src="js/three-boot.js"></script>

  <script defer src="js/core/util.js"></script>
  <script defer src="js/core/tween.js"></script>

  <script defer src="js/game/models.js"></script>
